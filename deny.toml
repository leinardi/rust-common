# cargo-deny: the dependency gate for the Rust workspace. `cargo deny --workspace check` runs every
# section; the advisories section needs the network to be current.
#
# Extracted from swarm-device-access/deny.toml at 8b4ab3a3e417 (itself adapted from
# swarm-scheduler-exporter's): the advisory, ban and source policy unchanged, the licence list
# rebuilt for this workspace's graph.

[graph]
all-features = true

[advisories]
# Every vulnerability and unsound advisory fails; "unmaintained" fails for direct and transitive
# crates alike unless ignored here by advisory ID, with a reason. An ignore written as
# `{ crate = "name" }` would only ignore yanked versions, so none is.
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# Only the licences the Cargo.lock graph needs, each added by the change that brings in the crate
# needing it. The workspace's own crates are MIT OR Apache-2.0, and so are most dependencies.
#
# cargo-deny 0.20.2's licence check leaves the workspace members' dev-dependencies out, so it checks
# none of their licences (tempfile and its graph here, under the meta crate's tests; serde_json and
# its graph, under go-slog's; tokio-util and http-body-util, under go-http's; rcgen and its graph,
# under docker-engine's TLS tests); the bans and sources checks do see them. Those licences are
# still decided here, by hand, rather than by omission: tempfile and everything under it
# (fastrand, getrandom, rustix, linux-raw-sys, libc, bitflags, cfg-if, once_cell) offer MIT or
# Apache-2.0 (rustix and linux-raw-sys also Apache-2.0 WITH LLVM-exception, which is not needed);
# serde_json, serde_core, itoa and memchr offer MIT, and zmij, tokio-util and http-body-util are
# MIT only; rcgen, yasna, time, time-core, deranged, powerfmt, num-conv and base64 offer MIT or
# Apache-2.0, pem is MIT only, and ring is the Apache-2.0 AND ISC allowed below.
allow = [
    # bollard and bollard-stubs (Apache-2.0 only), under testenv-core's `bollard`; most other
    # crates offer it beside MIT.
    "Apache-2.0",
    # winnow (MIT only), under the meta crate's and repo-meta's toml; memchr and aho-corasick
    # (Unlicense OR MIT), under repo-meta's regex; jiff and jiff-core (Unlicense OR MIT), under
    # go-compat; tokio (MIT only), under go-clock; hyper, hyper-util, http-body, bytes and mio (MIT
    # only), under go-http.
    "MIT",
    # unicode-ident ((MIT OR Apache-2.0) AND Unicode-3.0), through tokio-macros -> syn ->
    # proc-macro2 -> unicode-ident. tokio's `macros` feature needs it, both for the tests'
    # #[tokio::test] and for service-kit's `runtime` feature, whose signal helpers use select!.
    # Also the ICU crates (icu_*, zerovec, yoke, tinystr, litemap, writeable, potential_utf,
    # zerotrie, zerofrom; Unicode-3.0) under testenv-core's `bollard`: bollard -> url -> idna, as in
    # swarm-scheduler-exporter's and swarm-device-access's graphs.
    "Unicode-3.0",
    # ring (Apache-2.0 AND ISC), rustls-webpki (ISC) and untrusted (ISC), under docker-engine's
    # `tls` (rustls and tokio-rustls on ring), as in swarm-scheduler-exporter's deny.toml. No
    # webpki-roots (CDLA-Permissive-2.0): Docker TLS trusts the system pool and the user's ca.pem.
    "ISC",
    # subtle, under rustls; encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause), under repo-meta's
    # serde-saphyr.
    "BSD-3-Clause",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only. A consumer's deny.toml allows this repository as a git source; this one needs no
# git source of its own.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
