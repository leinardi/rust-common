[package]
name = "go-http"
description = "Go net/http server behaviours on hyper: the mux's answers, header order and framing, the four server deadlines, net.Listen's bind and the drain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "go_http"

[lints]
workspace = true

[features]
# The wire-capture harness (go_http::testing), for a program's own Go capture tests.
testing = ["tokio/io-util"]

[dependencies]
http-framing = { path = "../http-framing" }
go-compat = { path = "../go-compat" }
go-clock = { path = "../go-clock" }
# The `Date` header and Go's log.Printf time, as in go-compat: no tzdb or system feature.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# hyper's HTTP/1 server, with hyper-util's tokio glue and graceful drain.
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "tokio",
    "http1",
    "server",
    "server-graceful",
] }
bytes = "1.12.1"
# The listener and the connections' tasks, the deadlines' timers, select! in the accept loop.
tokio = { version = "1.54.1", default-features = false, features = ["net", "time", "rt", "macros"] }
# The listener, bound as Go's net.Listen binds it (SO_REUSEADDR, the dual-stack wildcard, the
# kernel's backlog).
socket2 = { version = "0.6.5", features = ["all"] }
# An IPv6 zone's interface index (SIOCGIFINDEX), without unsafe.
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }

[dev-dependencies]
# The paused clock (start_paused) and the loopback tests.
tokio = { version = "1.54.1", default-features = false, features = [
    "net",
    "time",
    "rt",
    "macros",
    "io-util",
    "sync",
    "test-util",
] }
# The tests' stop token, and hyper's own handler body for the header-timer controls.
tokio-util = { version = "0.7.20", default-features = false }
http-body-util = "0.1.5"
