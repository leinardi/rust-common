[package]
name = "service-kit"
description = "Process plumbing for a service: build stamps, the runtime and its bounded shutdown, signals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "service_kit"

[lints]
workspace = true

[features]
# `buildinfo!` needs nothing and is always there. `runtime` adds the multi-thread runtime builder,
# its shutdown bounded by a deadline (`Exit`), and the SIGINT/SIGTERM/SIGHUP helpers, all on tokio.
runtime = ["dep:tokio"]
# `http` adds the minimal HTTP/1 server (`http::serve`) on hyper and tokio: header-read and
# write-stall timeouts, bounded header sizes, a tracked graceful drain with a force-close deadline.
http = [
    "dep:bytes",
    "dep:hyper",
    "dep:hyper-util",
    "dep:libc",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower-service",
    "tokio/net",
]

[dependencies]
# rt-multi-thread for the runtime builder; signal for the handlers (and the I/O driver they run
# on); sync for the SIGHUP channel; time for the deadline; macros for select!.
tokio = { version = "1.54.1", default-features = false, optional = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

bytes = { version = "1.12.1", optional = true }
hyper = { version = "1.12.0", optional = true, default-features = false, features = [
    "http1",
    "server",
] }
# `tokio` for TokioIo and TokioTimer, `service` for TowerToHyperService.
hyper-util = { version = "0.1.21", optional = true, default-features = false, features = [
    "service",
    "tokio",
] }
# Only the accept-error constants (EMFILE and the like); no unsafe call.
libc = { version = "0.2.191", optional = true, default-features = false }
# CancellationToken (stop and cut) and the TaskTracker that owns every connection task.
tokio-util = { version = "0.7.20", optional = true, default-features = false, features = ["rt"] }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
# The router the server tests serve, and the upgrade primitives of its requests.
axum = { version = "0.8.9", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[[test]]
name = "signals"
required-features = ["runtime"]

[[test]]
name = "http"
required-features = ["http"]
