[package]
name = "go-prom"
description = "A Prometheus Go client-compatible registry: the text exposition 0.0.4, promhttp's negotiation and the process collector, byte for byte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "go_prom"

[lints]
workspace = true

[features]
# The Go tests' gatherSeries and seriesID (go_prom::testing), for a program's own collector tests.
testing = []

[dependencies]
go-compat = { path = "../go-compat" }
# promhttp's gzip, on the pure-Rust backend only.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# The process collector's tests compare its start time with the wall clock.
[dev-dependencies]
go-clock = { path = "../go-clock" }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
