# The per-crate feature matrix: `make rust-feature-matrix` (meta/src/bin/feature-matrix.rs) lints
# every target, warnings as errors, and runs the tests of each crate listed here under each of its
# sets, one package at a time:
#
#   cargo clippy --locked --all-targets --manifest-path crates/<name>/Cargo.toml -p <name> <flags> \
#       -- -D warnings
#   cargo test   --locked               --manifest-path crates/<name>/Cargo.toml -p <name> <flags>
#
# Format: one key per crate (the directory name under crates/, which is also the package name),
# holding a non-empty array of sets. A set is an inline table with any of:
#
#   no-default-features = true        -> --no-default-features
#   features = ["a", "b"]             -> --features a,b
#   all-features = true               -> --all-features
#
# `{}` is the default features. Any other key, an empty array, or a crate whose manifest is
# missing fails the run. Example:
#
#   docker-engine = [
#       { no-default-features = true },
#       { features = ["tcp", "tls"] },      # swarm-scheduler-exporter
#       { features = ["write", "attach"] }, # swarm-device-access
#       { all-features = true },
#   ]
#
# meta/tests/feature_sets.rs holds the file to the crates: every crate under crates/ has an entry,
# with a --no-default-features set and an --all-features set, and every feature it declares is
# named in at least one set. Add the exact set each consumer uses.

# go-compat has no features: both sets build the same crate, and are listed because every crate has
# them.
go-compat = [
    { no-default-features = true },
    { all-features = true },
]

# go-clock has no features; swarm-scheduler-exporter, swarm-device-access and awtrix-controller use
# it as it is.
go-clock = [
    { no-default-features = true },
    { all-features = true },
]

# service-kit: bitgauge and swarm-rootless-docker use `buildinfo!` alone, with no features (the
# no-default-features set, as the default enables nothing); swarm-scheduler-exporter and
# swarm-device-access also use the runtime and the signals, awtrix-controller the runtime only.
service-kit = [
    { no-default-features = true },
    { features = ["runtime"] },
    { all-features = true },
]
