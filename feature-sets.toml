# The per-crate feature matrix: `make rust-feature-matrix` (meta/src/bin/feature-matrix.rs) lints
# every target, warnings as errors, and runs the tests of each crate listed here under each of its
# sets, one package at a time:
#
#   cargo clippy --locked --all-targets --manifest-path crates/<name>/Cargo.toml -p <name> <flags> \
#       -- -D warnings
#   cargo test   --locked               --manifest-path crates/<name>/Cargo.toml -p <name> <flags>
#
# Format: one key per crate (the directory name under crates/, which is also the package name),
# holding a non-empty array of sets. A set is an inline table with any of:
#
#   no-default-features = true        -> --no-default-features
#   features = ["a", "b"]             -> --features a,b
#   all-features = true               -> --all-features
#
# `{}` is the default features. Any other key, an empty array, or a crate whose manifest is
# missing fails the run. Example:
#
#   docker-client = [
#       { no-default-features = true },
#       { features = ["attach", "test-util"] }, # swarm-rootless-docker
#       { all-features = true },
#   ]
#
# meta/tests/feature_sets.rs holds the file to the crates: every crate under crates/ has an entry,
# with a --no-default-features set and an --all-features set, and every feature it declares is
# named in at least one set. Add the exact set each consumer uses.

# clock has no features; swarm-scheduler-exporter, swarm-device-access and awtrix-controller use
# it as it is.
clock = [
    { no-default-features = true },
    { all-features = true },
]

# config-layer has no features: runhold (from v1.2.0) and bitgauge (once it moves over) build it
# as it is and pass their own environment rules, typing profile and rule texts.
config-layer = [
    { no-default-features = true },
    { all-features = true },
]

# service-kit: bitgauge and swarm-rootless-docker use `buildinfo!` alone, with no features (the
# no-default-features set, as the default enables nothing); swarm-scheduler-exporter and
# swarm-device-access also use the runtime and the signals, awtrix-controller the runtime only.
# `http` (the minimal server) and `process-metrics` (the `process_*` collector) are for bitgauge,
# swarm-scheduler-exporter and swarm-device-access; every feature is also built alone.
service-kit = [
    { no-default-features = true },
    { features = ["runtime"] },
    { features = ["http"] },
    { features = ["process-metrics"] },
    { features = ["http", "process-metrics"] },            # bitgauge
    { features = ["runtime", "http", "process-metrics"] }, # swarm-scheduler-exporter, swarm-device-access
    { all-features = true },
]

# testenv-core: swarm-scheduler-exporter and swarm-device-access build it with `async`, `bollard`
# and `redact` (bollard implies the other two; each suite passes its own labels, variables and
# resources); bitgauge with `sync` (its runner, beside the run filter, the tool gate, gitenv, envid
# and the identity rule of the default build); awtrix-controller, swarm-rootless-docker and
# repo-meta with the default features, which enable nothing (toolgate::Gate, gitenv). Every feature
# is also built alone.
testenv-core = [
    { no-default-features = true },
    { features = ["async"] },
    { features = ["sync"] },
    { features = ["bollard"] },
    { features = ["redact"] },
    { features = ["async", "bollard", "redact"] }, # swarm-scheduler-exporter, swarm-device-access
    { all-features = true },
]

# repo-meta has no features: swarm-scheduler-exporter, swarm-device-access, bitgauge,
# awtrix-controller, swarm-rootless-docker and this repository's meta crate build it as it is and
# pick each check's strictness by parameter.
repo-meta = [
    { no-default-features = true },
    { all-features = true },
]

# tracing-setup: awtrix-controller builds it with `log-bridge` (its dependencies log through the
# `log` facade), adding `testing` for its tests; swarm-rootless-docker and bitgauge with no features,
# adding `testing` likewise. Which writer, level, format, target and JSON span fields are parameters.
tracing-setup = [
    { no-default-features = true },
    { features = ["log-bridge"] },
    { features = ["testing"] },
    { features = ["log-bridge", "testing"] }, # awtrix-controller's tests
    { all-features = true },
]

# docker-client: swarm-rootless-docker builds it with `attach` (the host socket only: unix, no
# TCP) and `test-util` for its tests; a program that reads DOCKER_HOST adds `tcp` (and `tls` for
# DOCKER_TLS_VERIFY and DOCKER_CERT_PATH). The User-Agent, the API version and the
# response-header timeout are parameters. Every feature is also built alone.
docker-client = [
    { no-default-features = true },
    { features = ["tcp"] },
    { features = ["tls"] },
    { features = ["attach"] },
    { features = ["test-util"] },
    { features = ["exec"] },
    { features = ["attach", "test-util"] },     # swarm-rootless-docker, with its tests
    { features = ["exec", "test-util"] },       # exec with its tests
    { features = ["tcp", "tls", "test-util"] }, # a DOCKER_HOST client, with its tests
    { all-features = true },
]
