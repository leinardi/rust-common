name: Release

# Both halves of a release, on gh-reusable-workflows:
#   - a dispatch (bump) resolves the version (explicit, or derived by svu from the Conventional
#     Commits since the last vX.Y.Z tag), writes it into the crates' version (`[workspace.package]
#     version` in Cargo.toml, and the workspace entries of Cargo.lock) with `make release-bump`,
#     and opens the release/vX.Y.Z pull request, with CI dispatched on it;
#   - merging that pull request (release) is checked to be exactly that bump, waits for CI on the
#     merge commit, and publish tags vX.Y.Z on it and creates the GitHub release, so a release tag
#     always marks a tree whose crates carry its version.
# See CONTRIBUTING.md (Releasing).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 or v1.2.0 (empty: derive from the commits since the last release)"
        required: false
        type: string
      dry_run:
        description: "Dry run: resolve the version and show the bump, change nothing"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: read

# No concurrency group here: each reusable workflow has its own, never cancelled.
jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: leinardi/gh-reusable-workflows/.github/workflows/version-bump-pr.yaml@2d081e865362f09c19a32f5ec86bc8a122d7c4aa # v1.5.1
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      version_command: python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
      # The toolchain rust-toolchain.toml pins, for the cargo metadata the bump runs.
      bump_command: rustup toolchain install --no-self-update && make release-bump VERSION="$RELEASE_VERSION"
      allowed_files: Cargo.toml Cargo.lock

  release:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: leinardi/gh-reusable-workflows/.github/workflows/release-on-merge.yaml@2d081e865362f09c19a32f5ec86bc8a122d7c4aa # v1.5.1
    with:
      version_command: python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
      allowed_files: Cargo.toml Cargo.lock

  publish:
    needs: release
    if: needs.release.outputs.release == 'true'
    permissions:
      contents: write
    uses: leinardi/gh-reusable-workflows/.github/workflows/simple-tag-and-release.yaml@2d081e865362f09c19a32f5ec86bc8a122d7c4aa # v1.5.1
    with:
      version: ${{ needs.release.outputs.tag }}
