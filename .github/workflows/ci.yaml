name: CI

# The authoritative checks run on every pull request and every push to main; the reviewdog jobs only
# annotate pull requests. ci-result is the one check the branch ruleset requires.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A pull request's runs share one group per branch, so a newer push cancels the older run. Every
  # other run (a push to main, a dispatch) gets a group of its own: GitHub keeps only one pending
  # run per group, so a shared group would let a newer push replace a queued run, and a release
  # gate needs CI to have passed on that exact commit.
  group: "${{ github.workflow }} @ ${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  # The authoritative lint gate: every pre-commit hook over every file, with the versions pinned in
  # .pre-commit-config.yaml. Skipped hooks, each run by the rust job below: cargo-test and
  # cargo-deny (which needs the network).
  pre-commit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What dtolnay/rust-toolchain exported to every later step of the job.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the cargo-fmt, cargo-clippy and cargo-machete hooks and the language: system hooks that
      # run cargo. rust-toolchain.toml names the release, the components and the targets.
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      # The rust job's cache (shared-key ci, the same clippy flags), restored only: the rust job is
      # its one writer, so two jobs never race to save the same key.
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: false

      # The id gives the resolved Python version, which is part of the cache key.
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # actionlint runs the shellcheck on PATH over the workflows' run: scripts: the pinned one, not
      # the runner's.
      # The version is the shellcheck-py rev's in .pre-commit-config.yaml (meta/tests/toolchain.rs);
      # the action's default sha256 is that release's.
      - name: Set up ShellCheck
        uses: leinardi/gh-composite-actions/setup-shellcheck@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          version: v0.11.0

      # Restore only: pre-commit-warmup.yaml saves the entry on main under the same key, with the
      # same python_version and pre-commit version as above. The hook environments are bound to the
      # interpreter that built them, so the resolved Python version is part of the key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ steps.python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook on every file
        env:
          SKIP: cargo-test,cargo-deny
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier); this also fails on a file a hook creates, which its diff check
      # does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Reports inline PR review comments over a diff range; a push or a manual dispatch has neither a
  # pull request to comment on nor a base ref to diff against. Annotation only: pre-commit-all is
  # the gate, so none of these jobs is needed by ci-result.
  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The core file hooks only: the Rust hooks need the toolchain, which this job does not set
      # up, and pre-commit-all runs them.
      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-added-large-files

  markdownlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # Every commit in the pull request must follow Conventional Commits with a
    # scope: the release version is derived from commit types, and every commit
    # lands on main as it is. The local commit-msg hook only runs where
    # `make pre-commit-install` was run; this job is the check no commit skips.
    # It runs the repository's own conventional-pre-commit hook and skips merge
    # commits. No pull-request title check: squash merging is disabled.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # The Rust workspace: the same workspace-wide commands as make verify and the pre-commit hooks,
  # plus cargo-deny (advisories, licences, bans and sources; the advisory database needs the
  # network). The toolchain matches rust-toolchain.toml. The cache is saved only on main, the one
  # ref whose caches every pull request can restore, under shared-key ci, which pre-commit-all
  # restores too.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # What dtolnay/rust-toolchain exported to every later step of the job.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-features: the code behind every crate feature is linted too.
      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run the tests
        run: cargo test --workspace --locked

      - name: Check Rust documentation
        run: make rust-doc

      # make release-bump, which the Release workflow runs, against throwaway workspaces.
      - name: Test the release bump
        run: make release-bump-test

      - name: Check dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Every member's graph, not only one package's.
          arguments: --workspace
          command: check

  # Each crate linted (clippy, warnings as errors) and tested on its own under every feature set
  # feature-sets.toml lists for it (make rust-feature-matrix), so a feature that only compiles
  # because another member enables something, or that leaves a warning behind, is caught. A file
  # that lists no crate passes with a message saying so; one that lists a crate without a manifest
  # fails.
  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What dtolnay/rust-toolchain exported to every later step of the job.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      # Its own key: each crate builds under other feature sets than the rust job's.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          key: feature-matrix
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint and test every feature set
        run: make rust-feature-matrix

  # The single required check: green only when every gating job succeeded. conventional-commits
  # only runs on pull requests, so it may be skipped on a push or a dispatch. A new gating job is
  # added to needs.
  ci-result:
    if: always()
    needs:
      - pre-commit-all
      - conventional-commits
      - rust
      - feature-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
