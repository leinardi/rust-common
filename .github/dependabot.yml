version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    # fix, not chore: the release version is derived from commit types, and a
    # crate bump (security fixes included) changes what the consumers build
    # when they move to the next tag, so it produces a patch release. The
    # other ecosystems stay chore(deps) and bump nothing. Dev-dependencies
    # (the meta crate's test helpers) never reach a consumer, so their bumps
    # are chore(deps) and in a group of their own: one grouped PR carries a
    # single prefix, so mixing them would release crates that did not change.
    # The meta crate's own regex and toml are normal dependencies of an
    # unpublished crate, so their bumps are fix(deps) too; the planned
    # testenv-core and repo-meta crates depend on both, so they ship anyway.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      cargo-crates:
        dependency-type: "production"
        patterns:
          - "*"
      cargo-dev-crates:
        dependency-type: "development"
        patterns:
          - "*"
