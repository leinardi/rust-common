[package]
name = "meta"
version = "0.0.0"
description = "Repository meta-tests for rust-common"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The Markdown link checker (regex), and the feature-sets.toml reader the feature-matrix runner and
# the meta-tests share, with the crate manifests (toml).
[dependencies]
regex = "1.13.1"
toml = "1.1.8"

# The scratch trees of the negative controls.
[dev-dependencies]
tempfile = "3.27.0"
